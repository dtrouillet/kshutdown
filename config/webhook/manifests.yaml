---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-kshutdown-io-v1alpha1-shutdowngroup
  failurePolicy: Fail
  name: vshutdowngroup.kb.io
  rules:
  - apiGroups:
    - kshutdown.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - shutdowngroups
  sideEffects: None
