replicaCount: 1

image:
  repository: ghcr.io/dtrouillet/kshutdown
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Set to false if you want to bring your own ServiceAccount.
  create: true
  annotations: {}
  # Override the generated name.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

leaderElection:
  enabled: true

healthProbes:
  port: 8081

# Metrics endpoint. To enable, set both enabled=true and a non-zero bindAddress.
# Example: enabled: true, bindAddress: ":8443" (HTTPS, requires TLS config)
#          enabled: true, bindAddress: ":8080" (HTTP)
# Setting enabled=true while leaving bindAddress="0" keeps metrics disabled.
metrics:
  enabled: false
  bindAddress: "0"
