apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kshutdown.fullname" . }}-manager
  labels:
    {{- include "kshutdown.labels" . | nindent 4 }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["kshutdown.io"]
  resources: ["shutdowngroups"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["kshutdown.io"]
  resources: ["shutdowngroups/finalizers"]
  verbs: ["update"]
- apiGroups: ["kshutdown.io"]
  resources: ["shutdowngroups/status"]
  verbs: ["get", "patch"]
